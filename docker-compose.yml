services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: deepresearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deepresearch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deepresearch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The ONLY service that builds. worker and flower reuse this image,
  # so pip install runs once instead of three times in parallel.
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: deepresearch-app:latest
    container_name: deepresearch-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/deepresearch
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s   # was 15s; embedding + reranker models load at startup

  worker:
    image: deepresearch-app:latest
    pull_policy: never     # never try Docker Hub for a locally built image
    container_name: deepresearch-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/deepresearch
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=solo
    volumes:
      - app_data:/app/data   # shared with api so uploaded files are visible to the worker
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    image: deepresearch-app:latest
    pull_policy: never
    container_name: deepresearch-flower
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.workers.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker

volumes:
  postgres_data:
  app_data:
  hf_cache: